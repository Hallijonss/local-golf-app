<!doctype html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <!-- Never cache this HTML document: GitHub Pages gives no header control, and
         a stale index.html points at deleted hashed assets, which is what made the
         app intermittently load an old version. Hashed JS/CSS stay cacheable. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/local-golf-app/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mosgolf" />
    <link rel="apple-touch-icon" href="/local-golf-app/golfmos.png" />
    <link rel="icon" type="image/png" href="/local-golf-app/golfmos.png" />
    <!-- NO viewport-fit=cover: that draws edge-to-edge UNDER the Android system
         bars, and the 3-button nav bar isn't reported via env(safe-area-inset-*),
         so it covered our bottom controls. Default keeps the app in the safe area
         with the nav bar in its own space below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
